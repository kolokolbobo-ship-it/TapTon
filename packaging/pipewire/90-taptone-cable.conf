# TapTone virtual cable (installed by the taptone package). VB-CABLE topology
# built only from what PipeWire provides:
#
#   * "TapTone_Route" (Audio/Sink) is the cable's playback side ("CABLE
#     Input"): ALSA applications (TapTone) play into it via the
#     "taptone_route" pcm from /etc/asound.conf, PulseAudio clients target it
#     by name. Created here as a context.objects entry.
#   * "TapTone_Mic" (Audio/Source) is the recording side ("CABLE Output"):
#     voice chats select it as their microphone and it shows up as
#     "TapTone Microphone (Virtual)". Created by pw-loopback, which this file
#     starts via context.exec after the sink above exists.
#
# Why pw-loopback from context.exec instead of an in-daemon module-loopback
# entry: PipeWire processes context.modules before context.objects, so a
# config-level loopback always started before the sink existed and
# wireplumber then linked its capture stream to the system default
# MICROPHONE — the real microphone ended up wired into the cable. Creating
# the sink from context.modules (libpipewire-module-adapter) does not work on
# this version either: the module loads but silently produces no node.
# context.exec runs after the whole configuration is loaded, so the loopback
# below always finds "TapTone_Route". The helper is a child of this daemon
# and dies with it (systemd KillMode=control-group), so restarts never leave
# orphans behind.
#
# node.priority.session = -1000 on both cable nodes keeps them out of the
# default-device election: neither may ever become the system's default
# output or input, otherwise the desktop default would be swallowed by the
# cable (observed and fixed in the field).
context.objects = [
    {   factory = adapter
        args = {
            factory.name        = support.null-audio-sink
            node.name           = "TapTone_Route"
            node.description    = "TapTone_Route_(virtual_cable)"
            media.class         = "Audio/Sink"
            audio.position      = "FL,FR"
            monitor.passthrough = true
            node.priority.session = -1000
        }
    }
]

context.exec = [
    { path = "/usr/lib/taptone/virtual-mic.sh" }
]
