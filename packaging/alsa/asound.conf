# TapTone virtual cable for ALSA clients (installed by the taptone package).
# Playback goes into the cable's input side ("TapTone_Route", the VB-CABLE
# "CABLE Input" equivalent); capture reads the virtual microphone
# ("TapTone_Mic", the "CABLE Output" equivalent), so the in-app
# "Test microphone route" exercises the whole cable end to end. Requires the
# ALSA PipeWire plugin (libasound2-plugins / alsa-plugins-pipewire /
# alsa-plugins).
pcm.taptone_route {
	type pipewire
	playback_node "TapTone_Route"
	capture_node "TapTone_Mic"
	hint {
		show on
		description "TapTone Route (virtual cable)"
	}
}
