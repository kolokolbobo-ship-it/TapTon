[package]
name = "taptone"
version = "0.1.0"
edition = "2021"
description = "TapTone - a free open-source soundboard with dual audio output"
license = "MIT"
default-run = "taptone"

[lib]
name = "taptone"
path = "src/lib.rs"

[[bin]]
name = "taptone"
path = "src/main.rs"

[dependencies]
# Core (Part 1)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# GUI, audio and system integration
eframe = "0.29"
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }
global-hotkey = "0.6"
rfd = "0.15"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winres = "0.1.12"